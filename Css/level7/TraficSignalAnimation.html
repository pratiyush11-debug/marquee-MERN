<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer-container{
            
            width:50px;
            height: 150px;
            border:  solid black;
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            width:50px;
            height:50px;
            border:  solid black;
            background-color: black;


        }
        /* #item{
            border-radius: 50px;
        } */
        #item-1{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 35px;
            height:35px;
            border:  solid black;
            border-radius: 30px;
            background-color: darkred;
            animation-name: redd;
           
            animation-duration: 3s;
            animation-timing-function: ease-in-out;
            animation-delay:1s ;
            animation-iteration-count: infinite;



        }
        @keyframes redd{
            0%{
                background-color: red;
                box-shadow: 0px 0px 30px 10px;
                box-shadow: whitesmoke;
            }
        }
             @keyframes yelloww{
            0%{
                background-color: yellow;
                 box-shadow: 0px 0px 30px 10px;
                 box-shadow: whitesmoke;
            }
        }
         @keyframes greenn{
            0%{
                background-color: greenyellow;
                box-shadow: grey;
                 box-shadow: 0px 0px 30px 10px;
            }
        }
        #item-2{
               display: flex;
            justify-content: center;
            align-items: center;
             width: 35px;
            height:35px;
             border:  solid black;
              border-radius: 30px;
              background-color: rgb(255,255,0,0.5);
              
               animation-name: yelloww;
            animation-duration: 3s;
            animation-timing-function: ease-in-out;
            animation-delay:2s ;
            animation-iteration-count: infinite;


        }
        #item-3{
               display: flex;
            justify-content: center;
            align-items: center;
             width: 35px;
            height:35px;
             border:  solid black;
              border-radius: 30px;
              background-color: rgb(0, 128, 0);
               animation-name: greenn;
            animation-duration: 3s;
            animation-timing-function: ease-in-out;
            animation-delay:3s ;
            animation-iteration-count: infinite;

        }

    </style>
</head>
<body>
    <div class="outer-container">
        <div class="container">
            <div id="item-1"></div>
        </div>
        <div class="container">
            <div id="item-2"></div>
        </div>
        <div class="container ">
            <div id="item-3"></div>
        </div>
    </div>
    
</body>
</html>

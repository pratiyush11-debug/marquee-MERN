<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <!-- tranformation main hum chaar chiz kara sakte hai
     1.rotate(degree)
     2.scale(number(1,2,3or0.5 to reduce ))
     3.skew(degree)
     4.translate(px) -->
     <style>
        .box{
            height: 80px;
            width: 80px;
            border: 2px solid;
            border-radius: 5px;
            background-color: blanchedalmond;
            position: relative;
            top: 50px;
            left: 50px;
            animation-name: ghumakkad;
            animation-duration: 2s;
            animation-timing-function: ease-in-out;
            animation-delay:1s ;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            /* Animation Format */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */

        }
        /* @keyframes ghumakkad {
            from{
                left:10px;

            }
            to{
                left:200px;

            } */
                @keyframes ghumakkad {
                    0%{left:10px ;top:0px;}
                    50%{left:50px;top:100px;}
                    60%{left:300px;}
                    100%{left:400px;top:0px;}
            

            }
            
        
        

        
     </style>
</head>
<body>
    <div class="box">Animate</div>
    
</body>
</html>

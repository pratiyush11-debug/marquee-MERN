<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <style>
        .pseudo{
            height: 30px;
            width: 150px;
            background-color: hotpink;
            border: 2px solid;
            border-radius: 10px;

        } 
        .pseudo:hover{
            background-color: aqua;
        }
        .pseudo:active{
            height: 40px;
            width: 160px;
            background-color: bisque;
        }
    </style>
</head>
<body>
    <button class="pseudo">Learning Pseudo</button>
    
</body>
</html>

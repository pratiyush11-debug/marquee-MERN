<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set</title>
    <style>
        .progress-container{
            height: 25px;
            background-color: burlywood;
            width: 90%;
            border: 2px solid;
            border-radius: 20px;
            position:relative;
            left: 4%;
        }
        .progress-bar{
            background-color: blueviolet;
            height: 100%;
            width: 50%;
            border-radius: 20px;
            animation: progress 6s 5;
            animation: name duration timing-function delay iteration-count direction fill-mode;

        }
        /* @keyframes progress {
            from{width:0%}
            to{width:100%}
            
        } */
              @keyframes progress {
            0%{width:0%}
            90%{width:90%}
            95%{width: 50%;}
            100%{width:100%}
            
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Progress Bar</h1>
    <div  class="progress-container">
    <div class="progress-bar"></div>
    </div>
    
</body>
</html>

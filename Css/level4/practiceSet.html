<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div{
            width:200px;
            height: 50px;
        }
        #button{
            padding: 10px 0px 15px 0px;
            border: 10px solid black;
            border-radius: 10px;
            margin: 10px 20px 50px 100px;
        }
        #box1{
            box-sizing:border-box ;
            text-align: center;
            border: 4px solid  ;
            background-color: hotpink;
            height: 100px;
            width: 100px;
        }
        #box2{
            border: 2px solid;
            background-color: cyan;
            height: 100px;
            text-align: right;
            border-right:15px dotted rgb(51, 0, 255);
            width: 200px;
            box-sizing: border-box;

        }


    </style>
</head>
<body>
    <div id="div" > This is div Block</div>
    <button id="button"> Click Me</button>
    <h1 id="box1">Box 1</h1>
    <h1 id="box2"> Box 2</h1>
</body>
</html>

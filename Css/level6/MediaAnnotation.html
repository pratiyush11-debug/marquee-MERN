<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        .box{
            padding: 5px;

            height: 50px;
            width: 50px;
            background-color: aquamarine;

        }
        @media screen and (max-width:180px) { 
            .box{
                background-color:red;
              
            }
            
        }
    </style>
</head>
<body>
    <div class="box"> Box</div>
    
</body>
</html>

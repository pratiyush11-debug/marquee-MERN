<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet" href="Flex.css">
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        #container{
            border: 3px solid black;
            background-color: lightcoral;
            width: 300px;
            height: 200px;
            border-radius: 10px;


        }
        .box{
            height: 50px;
            width: 50px;
            border: 3px solid ;


        }
        #box1{
            background-color: aqua;
            float: right;

        }
        #box2{
            background-color: red;
            float: left;

        }
       
      
    </style>
</head>
<!-- float property is for alignment  we can use for left,right or none alignments -->
 <!-- rarly used -->
<body>
    <div id="container"> 
        <div id="box1" class="box"> Box1 </div>
        <div id="box2" class="box"> Box2</div>
    </div>
    
</body>
</html>

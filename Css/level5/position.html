<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        .box{ background-color: aqua;
            margin: 2.5px;
            width: 50px;
            height: 50px;

        }
        #box1{
            position: static;

        }
        #box2{
            position: relative;
            top: 10px;
            left: 60px;

        }
        #box3{
            position: absolute;
            top: 40px;

        }
        #box4{position: absolute;
        position: fixed;
        left: 20px; 
        background-color: brown;

        } 
        /* z-index: z-index jo hai stacking order batata hai kiske upaer konsa chiz show hona chahiye esa
         */
    </style>
</head>
<body>
    <div id="box1" class="box">Box1</div>
     <div id="box2" class="box">Box2</div>
      <div id="box3" class="box">Box3</div>
       <div id="box4" class="box">Box4</div>
        <div  class="box">Box5</div>
         <div  class="box">Box6</div>
         <div  class="box">Box</div>
         <div  class="box">Box</div>
         <div  class="box">Box</div>
    
</body>
</html>

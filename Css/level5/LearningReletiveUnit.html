<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* percentage(%) kitna percent rakhna hai parent ke hisab se
        em: kitna font size badhana hai parent se comapre karta hai
        ,rem:ye bhi fonsize badhane kam karne ke liye use hota hai jyda farak nhi hai rem aur em mai
        vh/vw: vh ko bolte hai viewport height aur vw ko bolte hai viewport width
        view port hota hai jitna jagah ek box le rha hai usko set karna jese hum height aur widht se karte hai par isme hum viewport ke hisab se karte hai set 
         , */
        *{
            margin: 0;
            padding: 0;
            font-size: 20px;
        }
        #div1{
            height: 100px;
            width: 200px;
            background-color: hotpink;
            font-size: 15px;
        }
        #div2{
            font-size: 25px;
            width:20vw;
            height:30vh;
            background-color:green;
            text-align: center;

        }
    </style>
</head>
<body>
    Body Text
    <div id="div1" >First div
    <div id="div2" >Second div</div>
    </div>
    
</body>
</html>
